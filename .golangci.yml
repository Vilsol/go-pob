version: "2"
linters:
  default: none
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - containedctx
    - contextcheck
    - copyloopvar
    - decorder
    - durationcheck
    - errcheck
    - errname
    - errorlint
    - exptostd
    - gocheckcompilerdirectives
    - gosec
    - gosmopolitan
    - govet
    - iface
    - ineffassign
    - mirror
    - misspell
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - nonamedreturns
    - prealloc
    - predeclared
    - reassign
    - recvcheck
    - revive
    - staticcheck
    - unconvert
    - usestdlibvars
    - usetesting
    - whitespace
    - wrapcheck
  settings:
    exhaustive:
      default-signifies-exhaustive: true
    goconst:
      min-len: 5
    gosec:
      excludes:
        - G602
    revive:
      rules:
        - name: unused-parameter
          disabled: true
    wrapcheck:
      ignore-sigs:
        - .Errorf(
      ignore-package-globs:
        - github.com/Vilsol/go-pob/*
        - golang.org/x/sync/errgroup*
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - staticcheck
        text: '^(QF|ST)[0-9]'
      - linters:
          - gosec
        path: _test\.go
        text: '(G702|G703):'
      - linters:
          - staticcheck
        text: 'SA9003:'
      - linters:
          - whitespace
        text: unnecessary leading newline
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
