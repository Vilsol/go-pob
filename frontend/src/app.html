<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/icon-192.png" />
    <meta name="theme-color" content="#1b1d21" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />

    <script>
      // lib/display/appearance.ts before the first paint: the theme, animations and Font scaling kept in this browser
      try {
        const t = localStorage.getItem('options:theme');
        const light = t === 'Light' || (t === 'Follow system' && matchMedia('(prefers-color-scheme: light)').matches);
        const r = document.documentElement;
        r.dataset.theme = light ? 'light' : t === 'High contrast' ? 'contrast' : 'dark';
        r.style.colorScheme = light ? 'light' : 'dark';
        if (localStorage.getItem('options:showAnimations') === 'false') r.dataset.motion = 'off';
        const pt = Number(localStorage.getItem('options:fontScaling'));
        if (pt) r.style.fontSize = (16 * Math.min(Math.max(pt, 6), 18)) / 12 + 'px';
      } catch {}
    </script>
    <script>
      // a chunk of another deployment that fails to load makes SvelteKit reload into the same failure while a service
      // worker keeps serving that deployment's shell: drop the workers and their deployment caches, then reload, once
      // per minute and tab (lib/pwa registers a fresh worker afterwards; IndexedDB builds and data are untouched)
      (() => {
        const KEY = 'pob:chunk-recovered';
        let busy = false;
        const recover = async () => {
          if (busy) return;
          busy = true;
          try {
            if (Date.now() - Number(sessionStorage.getItem(KEY) || 0) < 60000) return;
            const regs = (await navigator.serviceWorker?.getRegistrations()) ?? [];
            await Promise.all(regs.map((r) => r.unregister()));
            for (const k of await caches.keys()) if (k.startsWith('pob-app-')) await caches.delete(k);
            sessionStorage.setItem(KEY, String(Date.now()));
            console.warn('a chunk of another deployment failed to load: service worker reset, reloading');
            location.reload();
          } catch {
            busy = false;
          }
        };
        const chunkFailure = (e) =>
          /dynamically imported module|Importing a module script failed|error loading dynamically imported module|Unable to preload/i.test(
            String((e && e.message) || e)
          );
        addEventListener('vite:preloadError', () => void recover());
        addEventListener('unhandledrejection', (e) => {
          if (chunkFailure(e.reason)) void recover();
        });
        addEventListener('error', (e) => {
          if (chunkFailure(e.error || e.message)) void recover();
        });
      })();
    </script>
    %sveltekit.head%
  </head>
  <body>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
