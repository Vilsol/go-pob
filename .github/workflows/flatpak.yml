name: flatpak

permissions: read-all

on:
  push:
    branches: [dev, main]
    tags: ['v*']
    paths: ['desktop/**', '.github/workflows/flatpak.yml']
  pull_request:
    paths: ['desktop/**', '.github/workflows/flatpak.yml']
  workflow_dispatch:

jobs:
  flatpak:
    name: Flatpak bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Offline sources match go.sum and pnpm-lock.yaml
        run: python3 -I desktop/build/flatpak/sources.py --check

      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Cache downloaded sources
        uses: actions/cache@v4
        with:
          path: desktop/bin/flatpak-state/downloads
          key: flatpak-sources-${{ hashFiles('desktop/build/flatpak/*-sources.json') }}

      - name: Build
        run: ./desktop/scripts/flatpak.sh

      - name: Name the bundle
        id: bundle
        run: |
          manifest=(desktop/build/flatpak/*.yml)
          id=$(basename "${manifest[0]}" .yml)
          version=$(sed -n 's/.*<release version="\([^"]*\)".*/\1/p' "desktop/build/flatpak/$id.metainfo.xml" | head -n1)
          if [[ $GITHUB_REF_TYPE == tag && ${GITHUB_REF_NAME#v} != "$version" ]]; then
            echo "::warning::the metainfo's newest release is $version, the tag is $GITHUB_REF_NAME: add a <release> for it"
          fi
          mv "desktop/bin/$id.flatpak" desktop/bin/go-pob-x86_64.flatpak
          echo "file=desktop/bin/go-pob-x86_64.flatpak" >>"$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-flatpak
          path: ${{ steps.bundle.outputs.file }}
          if-no-files-found: error

      - name: Attach to the tag's release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          FILE: ${{ steps.bundle.outputs.file }}
        run: |
          for _ in $(seq 30); do
            if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" "$FILE" --repo "$GITHUB_REPOSITORY" --clobber
              exit 0
            fi
            sleep 30
          done
          echo "::notice::no release for $GITHUB_REF_NAME after 15 minutes; the bundle is only the workflow artifact"
