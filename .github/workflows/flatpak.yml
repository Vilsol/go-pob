name: flatpak

permissions: read-all

on:
  push:
    branches: [dev]
    paths: ['desktop/**', '.github/workflows/flatpak.yml']
  pull_request:
    paths: ['desktop/**', '.github/workflows/flatpak.yml']
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: The release's version, without the v
        type: string
        required: true

jobs:
  flatpak:
    name: Flatpak bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Offline sources match go.sum and pnpm-lock.yaml
        run: python3 -I desktop/build/flatpak/sources.py --check

      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Cache downloaded sources
        uses: actions/cache@v4
        with:
          path: desktop/bin/flatpak-state/downloads
          key: flatpak-sources-${{ hashFiles('desktop/build/flatpak/*-sources.json') }}

      - name: Release in the metainfo
        if: inputs.version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          metainfo=(desktop/build/flatpak/*.metainfo.xml)
          sed -i "s|^  <releases>\$|&\n    <release version=\"$VERSION\" date=\"$(date -u +%F)\"/>|" "${metainfo[0]}"
          grep -F "<release version=\"$VERSION\"" "${metainfo[0]}"

      - name: Build
        run: ./desktop/scripts/flatpak.sh

      - name: Name the bundle
        id: bundle
        run: |
          manifest=(desktop/build/flatpak/*.yml)
          id=$(basename "${manifest[0]}" .yml)
          mv "desktop/bin/$id.flatpak" desktop/bin/go-pob-x86_64.flatpak
          echo "file=desktop/bin/go-pob-x86_64.flatpak" >>"$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-flatpak
          path: ${{ steps.bundle.outputs.file }}
          if-no-files-found: error
