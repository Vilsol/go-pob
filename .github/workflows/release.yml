name: release

on:
  push:
    branches:
      - main
      - dev

permissions: read-all

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Version
    if: github.repository == 'Vilsol/go-pob'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      released: ${{ steps.version.outputs.released }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        if: github.ref_name == 'main'
        with:
          node-version-file: .node-version

      - name: Install semantic-release
        if: github.ref_name == 'main'
        run: npm ci --no-audit --no-fund
        working-directory: .github/release

      - name: Next version
        id: version
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse --short HEAD)
          if [[ $GITHUB_REF_NAME != main ]]; then
            echo "version=$sha" >>"$GITHUB_OUTPUT"
            echo "released=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          .github/release/first-release.sh
          export NEXT_VERSION_FILE=$RUNNER_TEMP/next-version
          .github/release/node_modules/.bin/semantic-release --dry-run
          if [[ -s $NEXT_VERSION_FILE ]]; then
            echo "version=$(cat "$NEXT_VERSION_FILE")" >>"$GITHUB_OUTPUT"
            echo "released=true" >>"$GITHUB_OUTPUT"
          else
            last=$(git describe --tags --abbrev=0 --match 'v[0-9]*')
            echo "version=${last#v}+$sha" >>"$GITHUB_OUTPUT"
            echo "released=false" >>"$GITHUB_OUTPUT"
          fi

  web:
    name: Deploy to Cloudflare Pages
    needs: [version]
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm i
        working-directory: frontend

      - name: Build wasm
        run: |
          go build -trimpath -tags=timetzdata -v -o frontend/static/go-pob.wasm ./wasm
        env:
          GOOS: js
          GOARCH: wasm

      - name: Compress wasm
        run: |
          gzip -k9 frontend/static/go-pob.wasm
          node frontend/scripts/compress-wasm.mjs
          rm frontend/static/go-pob.wasm frontend/static/go-pob.wasm.br.sha256

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_WASM_FILE: go-pob.wasm.br
          VITE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          pnpm run build --mode production
          ls -lah build

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.143.1
          workingDirectory: frontend
          command: pages deploy ./build --project-name=pob --branch=${{ github.ref_name }}

  desktop:
    name: Desktop
    needs: [version]
    if: needs.version.outputs.released == 'true'
    uses: ./.github/workflows/desktop.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets: inherit

  flatpak:
    name: Flatpak
    needs: [version]
    if: needs.version.outputs.released == 'true'
    uses: ./.github/workflows/flatpak.yml
    with:
      version: ${{ needs.version.outputs.version }}

  publish:
    name: Publish
    needs: [version, web, desktop, flatpak]
    if: needs.version.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install semantic-release
        run: npm ci --no-audit --no-fund
        working-directory: .github/release

      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release

      - name: Tag and release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_VERSION: ${{ needs.version.outputs.version }}
        run: |
          ls -la release
          .github/release/first-release.sh
          .github/release/node_modules/.bin/semantic-release
          git fetch --tags --quiet
          if ! git rev-parse --verify --quiet "refs/tags/v$EXPECTED_VERSION" >/dev/null; then
            echo "::error::semantic-release did not tag v$EXPECTED_VERSION"
            exit 1
          fi
