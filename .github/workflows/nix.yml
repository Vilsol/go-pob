name: nix

permissions: read-all

on:
  push:
    branches: [dev, main]
    paths: ['desktop/**', 'frontend/**', 'nix/**', 'flake.*', 'go.mod', 'go.sum', '.github/workflows/nix.yml']
  pull_request:
    paths: ['desktop/**', 'frontend/**', 'nix/**', 'flake.*', 'go.mod', 'go.sum', '.github/workflows/nix.yml']
  workflow_dispatch:

jobs:
  flake:
    name: Nix (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - name: Check and build
        shell: bash
        run: nix flake check -L 2>&1 | tee "$RUNNER_TEMP/nix.log"

      - name: Name a moved hash
        if: failure()
        run: |
          awk '
            /hash mismatch in fixed-output derivation/ {
              attr = /go-modules/ ? "vendorHash" : /pnpm-deps/ ? "pnpmDeps.hash" : "a fixed-output hash"
            }
            attr && /got:/ { print "::error file=nix/package.nix::" attr " moved: " $2; attr = "" }
          ' "$RUNNER_TEMP/nix.log"
