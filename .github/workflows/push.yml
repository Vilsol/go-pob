name: push

permissions: read-all

on: [push, pull_request]

# as mise.toml sets it: Node 26 otherwise gives the tests its own, file-less localStorage in place of the DOM one
env:
  NODE_OPTIONS: --no-experimental-webstorage

jobs:
  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          args: --timeout 5m

      - name: FMA census
        run: go run ./scripts/gopob fma-census

      - name: mise task shape
        run: go test ./scripts/gopob/ -run 'TestMiseTasks|TestNoMiseTaskRunsADeletedOriginal' -v

      - name: Data fields guard
        run: OPERATOR=true go test ./scripts/gopob/internal/datafields/ -run '^TestReadFieldsAreInTheCommittedList$' -v

  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup nodejs
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm i
        working-directory: frontend

      - name: Lint
        working-directory: ./frontend
        run: pnpm run lint

      # also writes .svelte-kit, whose generated types eslint reads
      - name: Svelte check
        working-directory: ./frontend
        run: pnpm run check --fail-on-warnings

      - name: ESLint
        working-directory: ./frontend
        run: pnpm run lint:eslint

  generated:
    name: Generated Bindings
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Regenerate bindings
        run: go generate ./wasm/exposition

      - name: Check the committed output is current
        run: |
          git add -N frontend/src/lib/types wasm/exposition/crystalline_gen.go
          git diff --exit-code -- frontend/src/lib/types wasm/exposition/crystalline_gen.go

  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build wasm
        run: go build -ldflags="-s -w" -v -o build.wasm ./wasm
        env:
          GOOS: js
          GOARCH: wasm

      - name: Build PoE2 wasm
        run: go build -ldflags="-s -w" -v -o build2.wasm ./wasm2
        env:
          GOOS: js
          GOARCH: wasm

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup nodejs
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm i
        working-directory: frontend

      - name: Build frontend
        working-directory: frontend
        run: pnpm run build

  test-backend-x86:
    name: Test Backend (x86)
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cache test data
        uses: actions/cache@v4
        with:
          path: |
            testdata/corpus-[0-9]*
            testdata/oracle-[0-9]*
            testdata/.installed-release
          key: testdata-${{ hashFiles('scripts/testdata.json') }}

      - name: Fetch test data
        run: go run ./scripts/testdatarelease fetch

      - name: Allow unprivileged user namespaces
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Test
        if: runner.os != 'Windows'
        run: go test -v -timeout 60m ./...

      - name: Test (without scripts/)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # shellcheck disable=SC2046
          go test -v -timeout 60m $(go list ./... | grep -v '/scripts/')

  test-backend-race:
    name: Test Backend (race)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cache test data
        uses: actions/cache@v4
        with:
          path: |
            testdata/corpus-[0-9]*
            testdata/oracle-[0-9]*
            testdata/.installed-release
          key: testdata-${{ hashFiles('scripts/testdata.json') }}

      - name: Fetch test data
        run: go run ./scripts/testdatarelease fetch

      - name: Test (race)
        run: ./.github/race_test.sh

  test-backend-wasm:
    name: Test Backend (wasm)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cache test data
        uses: actions/cache@v4
        with:
          path: |
            testdata/corpus-[0-9]*
            testdata/oracle-[0-9]*
            testdata/.installed-release
          key: testdata-${{ hashFiles('scripts/testdata.json') }}

      - name: Fetch test data
        run: go run ./scripts/testdatarelease fetch

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Test
        run: ./.github/wasm_test.sh
        env:
          GOOS: js
          GOARCH: wasm

  corpus-gate:
    name: Corpus Gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cache test data
        uses: actions/cache@v4
        with:
          path: |
            testdata/corpus-[0-9]*
            testdata/oracle-[0-9]*
            testdata/.installed-release
          key: testdata-${{ hashFiles('scripts/testdata.json') }}

      - name: Fetch test data
        run: go run ./scripts/testdatarelease fetch

      - name: Gate
        run: go test ./calculator/ -run TestCorpus3_29VsOracle -count=1 -v -timeout 60m
        env:
          CORPUS: "true"

  tinygo:
    name: TinyGo engine
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup nodejs
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Set up TinyGo
        run: ./.github/tinygo_install.sh

      - name: Cache test data
        uses: actions/cache@v4
        with:
          path: |
            testdata/corpus-[0-9]*
            testdata/oracle-[0-9]*
            testdata/.installed-release
          key: testdata-${{ hashFiles('scripts/testdata.json') }}

      - name: Fetch test data
        run: go run ./scripts/testdatarelease fetch

      - name: Build wasm
        run: |
          GOOS=js GOARCH=wasm go build -o frontend/static/go-pob.wasm ./wasm
          GOOS=js GOARCH=wasm go build -o frontend/static/go-pob2.wasm ./wasm2
          # each TinyGo build is mostly single-threaded, so the two run side by side
          ./.github/tinygo_build.sh wasm frontend/static/go-pob-tiny.wasm & one=$!
          ./.github/tinygo_build.sh wasm2 frontend/static/go-pob2-tiny.wasm & two=$!
          wait "$one"
          wait "$two"

      # both engines over the same builds; every output must be bit-identical
      - name: PoE1 corpus sample, TinyGo vs Go
        run: node frontend/harness/engine_diff.mjs poe1 --sample 200 --jobs 2 testdata/corpus-3.29

      - name: PoE2 fixture builds, TinyGo vs Go
        run: node frontend/harness/engine_diff.mjs poe2 wasm2/exposition/testdata

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup nodejs
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm i
        working-directory: frontend

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cache test data
        uses: actions/cache@v4
        with:
          path: |
            testdata/corpus-[0-9]*
            testdata/oracle-[0-9]*
            testdata/.installed-release
          key: testdata-${{ hashFiles('scripts/testdata.json') }}

      - name: Fetch test data
        run: go run ./scripts/testdatarelease fetch

      - name: Build wasm
        run: |
          go build -o frontend/static/go-pob.wasm ./wasm
          go build -o frontend/static/go-pob2.wasm ./wasm2
        env:
          GOOS: js
          GOARCH: wasm

      - name: Populate the bundle cache
        run: |
          go test -count=1 ./wasm/exposition/
          go test -count=1 -run TestLoadTreeGraph ./data/

      - name: Test
        run: pnpm exec vitest run --project unit --exclude 'e2e/**'
        working-directory: frontend

  # the stories need no wasm or game data, so they run beside the unit tests
  test-storybook:
    name: Test Storybook
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup nodejs
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm i
        working-directory: frontend

      - name: Test
        run: pnpm exec vitest run --project storybook
        working-directory: frontend
