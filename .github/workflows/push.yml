name: push

permissions: read-all

on: [push, pull_request]

jobs:
  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          args: --timeout 5m

  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup nodejs
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm i
        working-directory: frontend

      - name: Lint
        working-directory: ./frontend
        run: pnpm run lint

  generated:
    name: Generated Bindings
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Regenerate bindings
        run: go generate ./wasm/exposition

      - name: Check the committed output is current
        run: |
          git add -N frontend/src/lib/types wasm/exposition/crystalline_gen.go
          git diff --exit-code -- frontend/src/lib/types wasm/exposition/crystalline_gen.go

  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    needs:
      - lint-backend
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build wasm
        run: go build -ldflags="-s -w" -v -o build.wasm ./wasm
        env:
          GOOS: js
          GOARCH: wasm

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs:
      - lint-frontend
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup nodejs
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm i
        working-directory: frontend

      - name: Build frontend
        working-directory: frontend
        run: pnpm run build

  test-backend-x86:
    name: Test Backend (x86)
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    needs:
      - build-backend
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cache test data
        uses: actions/cache@v4
        with:
          path: |
            testdata/corpus-[0-9]*
            testdata/oracle-[0-9]*
            testdata/.installed-release
          key: testdata-${{ hashFiles('scripts/testdata.json') }}

      - name: Fetch test data
        run: go run ./scripts/testdatarelease fetch

      - name: Test
        run: go test -v -timeout 60m ./...

  test-backend-race:
    name: Test Backend (race)
    runs-on: ubuntu-latest
    needs:
      - build-backend
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cache test data
        uses: actions/cache@v4
        with:
          path: |
            testdata/corpus-[0-9]*
            testdata/oracle-[0-9]*
            testdata/.installed-release
          key: testdata-${{ hashFiles('scripts/testdata.json') }}

      - name: Fetch test data
        run: go run ./scripts/testdatarelease fetch

      - name: Test (race)
        run: go test -race -timeout 60m ./calculator/... ./moddb/... ./mod/... ./data/...

  test-backend-wasm:
    name: Test Backend (wasm)
    runs-on: ubuntu-latest
    needs:
      - build-backend
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cache test data
        uses: actions/cache@v4
        with:
          path: |
            testdata/corpus-[0-9]*
            testdata/oracle-[0-9]*
            testdata/.installed-release
          key: testdata-${{ hashFiles('scripts/testdata.json') }}

      - name: Fetch test data
        run: go run ./scripts/testdatarelease fetch

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Test
        run: ./.github/wasm_test.sh
        env:
          GOOS: js
          GOARCH: wasm

  corpus-gate:
    name: Corpus Gate
    runs-on: ubuntu-latest
    needs:
      - build-backend
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cache test data
        uses: actions/cache@v4
        with:
          path: |
            testdata/corpus-[0-9]*
            testdata/oracle-[0-9]*
            testdata/.installed-release
          key: testdata-${{ hashFiles('scripts/testdata.json') }}

      - name: Fetch test data
        run: go run ./scripts/testdatarelease fetch

      - name: Gate
        run: go test ./calculator/ -run TestCorpus3_29VsOracle -count=1 -v -timeout 60m
        env:
          CORPUS: "true"

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    needs:
      - build-frontend
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup nodejs
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm i
        working-directory: frontend

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cache test data
        uses: actions/cache@v4
        with:
          path: |
            testdata/corpus-[0-9]*
            testdata/oracle-[0-9]*
            testdata/.installed-release
          key: testdata-${{ hashFiles('scripts/testdata.json') }}

      - name: Fetch test data
        run: go run ./scripts/testdatarelease fetch

      - name: Build wasm
        run: go build -o frontend/static/go-pob.wasm ./wasm
        env:
          GOOS: js
          GOARCH: wasm

      - name: Populate the bundle cache
        run: |
          go test -count=1 ./wasm/exposition/
          go test -count=1 -run TestLoadTreeGraph ./data/

      - name: Test
        run: pnpm exec vitest run --exclude 'e2e/**'
        working-directory: frontend
