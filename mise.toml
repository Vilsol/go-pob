  '{% if not usage.snap %}curl -fsS -o /tmp/pobcodes-corpus.json https://api.pob.codes/test-builds/corpus{% endif %}',
  '''
{{vars.NICE}} go run ./scripts/corpus snapshot -in {% if usage.snap %}{{usage.snap}}{% else %}/tmp/pobcodes-corpus.json{% endif %} \
-corpus testdata/corpus-{{usage.patch}} -patch {{usage.patch}} \
-tree {% if usage.tree %}{{usage.tree}}{% else %}{{usage.patch | replace(from=".", to="_")}}{% endif %} \
-index testdata/corpus-index/{{usage.patch}} {% if usage.write %}-write{% endif %}
''',
]

[tasks.corpus-dump-each]
description = "Dump each build in LIST through the pinned PoB, one deterministic-LuaJIT process per build — --list <file> --out <new dir> [--jobs 4] [--builds testdata/corpus-3.29]"
usage = '''
flag "--builds <builds>" env="BUILDS" default="testdata/corpus-3.29"
flag "--jobs <jobs>" env="JOBS" default="4"
flag "--list <list>" env="LIST"
flag "--out <out>" env="OUT"
flag "--pob-dir <dir>" env="POB_DIR" default="{{vars.POB_DEFAULT}}"
'''
run = 'LUAJIT="{{vars.MAIN}}/.luajit-det/bin/luajit" {{vars.NICE}} scripts/corpus/dump_each.sh {{usage.pob_dir}} . {{usage.builds}} {{usage.list}} {{usage.out}} {{usage.jobs}}'

[tasks.lint-tasks]
description = "The mise tasks' shape rules (line length, run size, no branching, no deleted originals)"
run = '''{{vars.NICE}} go test ./scripts/gopob/ -run 'TestMiseTasks|TestNoMiseTaskRunsADeletedOriginal' '''
