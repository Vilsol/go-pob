min_version = '2025.2.7'

[tools]
go = "1.26.6"
golangci-lint = "2.12.2"
zig = "0.13.0"
luajit = "2.1.1744318430"
node = "26"
pnpm = "10.6.3"
"npm:wrangler" = "4.143.1"
watchexec = "2.8.0"
tinygo = "0.44.0"

[env]
MISE_NODE_COREPACK = true
NODE_OPTIONS = "--no-experimental-webstorage"
GOFLAGS = "-trimpath"

[hooks]
enter = "mise i -q"
postinstall = 'npx corepack enable'

[settings]
experimental = true

# Every task is `mise run <name>`; `mise run <name> --help` lists its flags. Scripts too long or branchy for a
# table live in mise-tasks/. The exec() results are cached an hour per checkout, since mise renders [vars] on
# every invocation, the shell hook included.
[vars]
GOPOB = "go run {{config_root}}/scripts/gopob"
NICE = "{{vars.GOPOB}} nice"
MAIN = '''{{ exec(command="dirname \"$(git -C " ~ config_root ~ " rev-parse --path-format=absolute --git-common-dir)\"", cache_key="gopob-main:" ~ config_root, cache_duration="1h") }}'''
POB_DEFAULT = '''{{ exec(command="realpath \"$(git -C " ~ config_root ~ " rev-parse --path-format=absolute --git-common-dir)/../../PathOfBuilding\" 2>/dev/null || echo ../PathOfBuilding", cache_key="gopob-pob:" ~ config_root, cache_duration="1h") }}'''
POB2_DEFAULT = '''{{ exec(command="realpath \"$(git -C " ~ config_root ~ " rev-parse --path-format=absolute --git-common-dir)/../../PathOfBuilding-PoE2\" 2>/dev/null || echo ../PathOfBuilding-PoE2", cache_key="gopob-pob2:" ~ config_root, cache_duration="1h") }}'''

[tasks.test-race]
description = "Run the concurrent-evaluation tests under the race detector, as CI does (cgo via zig cc)"
run = 'go run ./scripts/gopob nice env CGO_ENABLED=1 CC="zig cc" GOFLAGS=-ldflags=-linkmode=external ./.github/race_test.sh'

[tasks.test-wasm]
description = "Run the tests only js/wasm can prove under node, as CI does"
run = 'go run ./scripts/gopob nice ./.github/wasm_test.sh'

[tasks.e2e-full]
description = "mise run e2e including the @slow tests (benchmarks, WebGL draw lists, random sequences), as CI runs it"
usage = '''
arg "[args]..." var=#true double_dash="required" help="passed on to playwright"
'''
run = 'eval "set -- $usage_args"; mise run e2e --slow -- "$@"'

# the packages the two wasm builds compile (GOOS=js GOARCH=wasm go list -deps ./wasm ./wasm2)
[task_templates.wasm-sources]
sources = ["go.mod", "go.sum", "builds/**/*.go", "calculator/**/*.go", "calculator2/**/*.go", "config/**/*.go", "data/**/*.go", "mod/**/*.go", "moddb/**/*.go", "pob/**/*.go", "pob2/**/*.go", "storage/**/*.go", "utils/**/*.go", "wasm/**/*.go", "wasm2/**/*.go"]

[tasks.dev-go]
description = "Watch the wasm's Go packages and rebuild the wasm + typings (filesystem events, no polling)"
run = '''mise watch -i '**/crystalline_gen.go' wasm-rebuild'''

[tasks.wasm-rebuild]
extends = "wasm-sources"
hide = true
outputs = ["frontend/static/go-pob.wasm"]
run = [{ task = "build-go" }, { task = "generate-typings" }]

[tasks.dev-go2]
description = "Watch the wasm's Go packages and rebuild the PoE2 wasm + typings (filesystem events, no polling)"
run = '''mise watch -i '**/crystalline_gen.go' wasm2-rebuild'''

[tasks.wasm2-rebuild]
extends = "wasm-sources"
hide = true
outputs = ["frontend/static/go-pob2.wasm"]
run = [{ task = "build-go2" }, { task = "generate2" }]

[tasks.build-go]
description = "Build Go WASM binary and place it in the frontend (skipped when no wasm source is newer than it)"
extends = "wasm-sources"
outputs = ["frontend/static/go-pob.wasm"]
run = '{{vars.NICE}} env GOOS=js GOARCH=wasm go build -v -o frontend/static/go-pob.wasm ./wasm'

[tasks.build-go2]
description = "Build the PoE2 Go WASM binary (skipped when no wasm source is newer than it)"
extends = "wasm-sources"
outputs = ["frontend/static/go-pob2.wasm"]
run = '{{vars.NICE}} env GOOS=js GOARCH=wasm go build -v -o frontend/static/go-pob2.wasm ./wasm2'

# TinyGo's wasm32 build of each, the engine Settings can switch to
[tasks.build-go-tiny]
description = "Build the TinyGo PoE1 WASM binary into frontend/static/go-pob-tiny.wasm (minutes; skipped when no wasm source is newer than it)"
extends = "wasm-sources"
outputs = ["frontend/static/go-pob-tiny.wasm"]
run = '{{vars.NICE}} ./.github/tinygo_build.sh wasm frontend/static/go-pob-tiny.wasm'

[tasks.build-go2-tiny]
description = "Build the TinyGo PoE2 WASM binary into frontend/static/go-pob2-tiny.wasm (minutes; skipped when no wasm source is newer than it)"
extends = "wasm-sources"
outputs = ["frontend/static/go-pob2-tiny.wasm"]
run = '{{vars.NICE}} ./.github/tinygo_build.sh wasm2 frontend/static/go-pob2-tiny.wasm'

[tasks.engine-diff]
description = "The TinyGo and the standard Go wasm over the same builds, every output compared bit for bit (--game poe1|poe2, --sample N spreads N over the list, --jobs N); exits 1 on a difference"
depends = ["build-go", "build-go2", "build-go-tiny", "build-go2-tiny"]
usage = '''
flag "--game <game>" env="GAME" default="poe1" {
  choices "poe1" "poe2"
}
flag "--sample <sample>" env="SAMPLE" default="0"
flag "--jobs <jobs>" env="JOBS" default="2"
arg "<inputs>..." var=#true help="build XMLs, or folders of them (testdata/corpus-3.29, testdata/corpus-poe2-0.5)"
'''
run = 'eval "set -- $usage_inputs"; {{vars.NICE}} node frontend/harness/engine_diff.mjs {{usage.game}} --sample {{usage.sample}} --jobs {{usage.jobs}} "$@"'

[tasks.build-frontend]
description = "Build JS frontend"
dir = "frontend"
run = [
  '{{vars.NICE}} pnpm install',
  '{{vars.NICE}} pnpm run build',
]

[tasks.generate-typings]
description = "Generate the crystalline bindings, JS module and TS typings"
run = '{{vars.NICE}} go generate ./wasm/exposition'

[tasks.generate2]
description = "Generate the PoE2 crystalline bindings, JS module and TS typings"
run = '{{vars.NICE}} env GOFLAGS="-trimpath -tags=bindings2" go generate ./wasm2/exposition'

[tasks.generate]
description = "Run all generate commands"
depends = ["generate-typings"]

[tasks.build]
description = "Build everything"
run = [
  { task = "build-go" },
  { task = "build-frontend" },
]

[tasks.dev-frontend]
description = "Frontend dev command (live updates)"
dir = "frontend"
run = [
  '{{vars.NICE}} pnpm install',
  '{{vars.NICE}} pnpm run dev --clearScreen false',
]

[tasks.build-desktop]
description = "Build the Linux desktop app into desktop/bin/go-pob (--tags noimportproxy builds it without the import proxy)"
depends = ["desktop-dist"]
usage = '''
flag "--tags <tags>" env="TAGS"
'''
run = '{{vars.NICE}} ./desktop/scripts/build.sh desktop/bin/go-pob production {{usage.tags}}'

[tasks.desktop-dist]
description = "The frontend as every desktop build embeds it (VITE_DESKTOP=1, the .wasm.gz of each standard and TinyGo build only) into desktop/dist"
run = [
  '{{vars.NICE}} ./desktop/scripts/wasm.sh',
  'cd frontend && {{vars.NICE}} env VITE_DESKTOP=1 npx vite build --logLevel warn',
  'rsync -a --delete --exclude .gitkeep --exclude "go-pob*.wasm" --exclude "go-pob*.wasm.br" --exclude service-worker.js --exclude _headers frontend/build/ desktop/dist/',
]

[tasks.dev-desktop]
description = "Run the desktop host (devtools on) over vite dev with VITE_DESKTOP=1; reload with Ctrl+R (PORT=5180, --tags)"
depends = ["build-go"]
usage = '''
flag "--tags <tags>" env="TAGS"
'''
run = './desktop/scripts/dev.sh {{usage.tags}}'

[tasks.run-desktop-headless]
description = "Run desktop/bin/go-pob on a private Xvfb display with --probe <js> injected (desktop/e2e/); --secs 120, DESK_HOME= keeps state"
usage = '''
flag "--probe <probe>" env="PROBE" required=#true
flag "--secs <secs>" env="SECS" default="120"
'''
run = './desktop/scripts/run-headless.sh desktop/bin/go-pob {{usage.probe}} {{usage.secs}}'

[tasks.e2e-desktop]
description = "The desktop end-to-end proof, headless: boot, PoB's Builds folder, New build, open + save three corpus builds, export, relaunch on the disk cache, reopen (build-desktop first)"
run = '{{vars.NICE}} ./desktop/e2e/run.sh'

[tasks.package-desktop]
description = "Linux release into desktop/bin/release (--out): binary, AppImage, deb, rpm, built in an Ubuntu 24.04 container (VERSION=, UPDATE_URL=, UPDATE_PUBLIC_KEY=)"
depends = ["build-desktop"]
usage = '''
flag "--out <out>" env="OUT"
'''
run = '{{vars.NICE}} ./desktop/scripts/package.sh {{usage.out}}'

[tasks.package-desktop-windows]
description = "Windows release into desktop/bin/release-windows (--out): portable zip and per-user NSIS installer, cross-compiled without cgo, unsigned (VERSION=, UPDATE_URL=, UPDATE_PUBLIC_KEY=)"
depends = ["desktop-dist"]
usage = '''
flag "--out <out>" env="OUT"
'''
run = '{{vars.NICE}} ./desktop/scripts/package-windows.sh {{usage.out}}'

[tasks.package-desktop-macos]
description = "macOS release into desktop/bin/release-macos (--out), on a Mac only: per architecture (ARCHS=) a go-pob.app, ad-hoc signed, in a dmg and a zip (VERSION=, UPDATE_URL=, UPDATE_PUBLIC_KEY=; SIGN_IDENTITY=, NOTARY_PROFILE= sign and notarise)"
depends = ["desktop-dist"]
usage = '''
flag "--out <out>" env="OUT" default="desktop/bin/release-macos"
'''
run = '{{vars.NICE}} ./desktop/build/darwin/package.sh {{usage.out}}'

[tasks.e2e-desktop-release]
description = "Each Linux package headless in a clean container: TLS game data, New build, GTK file chooser; the deb/rpm installs (package-desktop first; --out, --cases)"
usage = '''
flag "--cases <cases>" env="CASES"
flag "--out <out>" env="OUT" default="desktop/bin/release"
'''
run = '{{vars.NICE}} ./desktop/release-e2e/run.sh {{usage.out}} {{usage.cases}}'

[tasks.e2e-desktop-update]
description = "The updater proof: OLD/NEW package-desktop outputs built with UPDATE_URL=http://127.0.0.1:18731/update.json and KEY's public half; signed release installs, tampered/unsigned/other-key refused"
usage = '''
flag "--key <key>" env="KEY" required=#true
flag "--new <new>" env="NEW" required=#true
flag "--old <old>" env="OLD" required=#true
'''
run = '{{vars.NICE}} ./desktop/release-e2e/update.sh {{usage.old}} {{usage.new}} {{usage.key}}'

[tasks.e2e-desktop-update-windows]
description = "The updater proof on Windows, under Wine with no display: the desktop's updater (windowless) swaps its exe for a signed go-pob-windows-amd64.zip and relaunches; tampered/unsigned/other-key refused"
run = '{{vars.NICE}} ./desktop/release-e2e/update-windows.sh'

[tasks.build-desktop-nix]
description = "Build the desktop app with Nix (nix/package.nix, from the committed and staged tree) into desktop/bin/nix, a store link"
run = '{{vars.NICE}} nix build --out-link desktop/bin/nix .#go-pob'

[tasks.e2e-desktop-nix]
description = "mise run e2e-desktop over the Nix build, with TLS and GTK schemas from its wrapper alone"
depends = ["build-desktop-nix"]
run = '{{vars.NICE}} env GIO_EXTRA_MODULES=/var/empty GSETTINGS_SCHEMA_DIR=/var/empty BIN=desktop/bin/nix/bin/go-pob ./desktop/e2e/run.sh'

[tasks.nixpkgs-template]
description = "Regenerate nix/nixpkgs/pkgs/by-name/go/go-pob/package.nix from nix/package.nix (--version, --hash fake until the tag is pushed)"
usage = '''
flag "--hash <hash>" env="HASH" default="fake"
flag "--version <version>" env="VERSION" default="0.1.0"
'''
run = './nix/nixpkgs/render.sh {{usage.version}} {{usage.hash}} > nix/nixpkgs/pkgs/by-name/go/go-pob/package.nix'

[tasks.test-desktop]
description = "The desktop host's Go tests (no cgo: desktop/host only)"
run = '{{vars.NICE}} env -C desktop go test ./host/...'

[tasks.lint-desktop]
description = "golangci-lint over the desktop module (--tags noimportproxy lints the build without the import proxy)"
usage = '''
flag "--tags <tags>" env="TAGS"
'''
run = '{{vars.NICE}} env -C desktop ./scripts/gtk-env.sh golangci-lint run --build-tags gtk3{% if usage.tags %},{{usage.tags}}{% endif %} ./...'

[tasks.flatpak-sources]
description = "Regenerate the Flatpak's offline sources (desktop/build/flatpak/{go,node}-sources.json) after go.sum, desktop/go.sum or frontend/pnpm-lock.yaml change; --check only compares"
usage = '''
flag "--check" env="CHECK"
'''
run = 'python3 -I desktop/build/flatpak/sources.py {% if usage.check %}--check{% endif %}'

[tasks.build-flatpak]
description = "Build the Flatpak from this checkout offline (flatpak-builder, GNOME runtime from Flathub, --user), install it and write desktop/bin/<app-id>.flatpak (FLATPAK_USER_DIR= moves flatpak's user installation)"
run = '{{vars.NICE}} ./desktop/scripts/flatpak.sh'

[tasks.e2e-flatpak]
description = "The desktop end-to-end proof against the installed Flatpak through flatpak run, headless, then a pob:// link through its desktop entry to the running instance (build-flatpak first; xdotool, gio)"
run = '{{vars.NICE}} ./desktop/flatpak-e2e/run.sh'

[tasks.e2e-flatpak-portal]
description = "The installed Flatpak's file dialogs through xdg-desktop-portal, headless: open, save and builds folder answered with xdotool outside the sandbox's own view (build-flatpak first)"
run = '{{vars.NICE}} ./desktop/flatpak-e2e/portal.sh'

[tasks.storybook]
description = "Storybook for the design-spec components (http://localhost:6006)"
dir = "frontend"
run = '{{vars.NICE}} pnpm run storybook'

[tasks.storybook-tests]
description = "Every story as a browser test: renders, play function, a11y (axe)"
dir = "frontend"
run = '{{vars.NICE}} npx vitest run --project storybook'

[tasks.design-fixtures]
description = "Regenerate the Storybook shell's sample data from real corpus builds (--check fails on drift instead)"
dir = "frontend"
depends = ["build-go"]
usage = '''
flag "--check" env="CHECK"
'''
run = '{{vars.NICE}} node harness/design_fixtures.js {% if usage.check %}--check{% endif %}'

[tasks.storybook-publish]
description = "Build the static Storybook and publish it to Chromatic (token: CHROMATIC_PROJECT_TOKEN in frontend/.env.local)"
dir = "frontend"
run = [
  '{{vars.NICE}} pnpm run build-storybook',
  'set -a && . ./.env.local && set +a && {{vars.NICE}} pnpm dlx chromatic@18.10.1 --storybook-build-dir storybook-static --exit-zero-on-changes --exit-once-uploaded',
]

[tasks.test-go]
description = "Run all Go tests"
run = '{{vars.NICE}} go test -v ./...'

[tasks.test-fast]
description = "Tier 1: every test that does NOT need the corpus (~2m20s, 0 red at base, measured 2026-10-24). Run this per fix."
run = 'env -u CORPUS {{vars.NICE}} go test ./...'

[tasks.affected-tests]
description = "go test only the packages a change can reach: changed since BASE (default merge-base dev) plus the working tree, and every package whose tests import them. --run <regex>, --dry prints the pick only, CLI_ARGS pass to go test"
usage = '''
flag "--base <base>" env="BASE"
flag "--dry" env="DRY"
flag "--run <run>" env="RUN"
arg "[args]..." var=#true double_dash="required" help="passed on"
'''
run = 'eval "set -- $usage_args"; env -u CORPUS BASE="{{usage.base}}" {{vars.GOPOB}} affected-tests {% if usage.dry %}--dry{% endif %} {% if usage.run %}-run "{{usage.run}}"{% endif %} "$@"'

[tasks.test-operator-fast]
description = "The operator suite (OPERATOR=true CORPUS=true go test ./...) without the tests in scripts/gopob/operator_slow_tests.txt; prints failures only and names any test that newly took >= 10s. CLI_ARGS pass to go test"
run = '{{vars.GOPOB}} test-tiers fast'

[tasks.test-operator-affected]
description = "test-operator-fast over affected-tests' packages only (--base <ref>, default merge-base dev, plus the working tree); nothing picked runs nothing. CLI_ARGS pass to go test"
usage = '''
flag "--base <base>" env="BASE"
arg "[args]..." var=#true double_dash="required" help="passed on"
'''
run = 'eval "set -- $usage_args"; BASE="{{usage.base}}" {{vars.GOPOB}} test-tiers affected "$@"'

[tasks.test-operator-slow]
description = "Only the operator-suite tests in scripts/gopob/operator_slow_tests.txt (the other half of test-operator-fast)"
run = '{{vars.GOPOB}} test-tiers slow'

[tasks.gate]
description = "Tier 2: the AUTHORITATIVE accuracy gate alone (~16s, GREEN at base). The number, without the sweeps."
run = 'CORPUS=true {{vars.NICE}} go test ./calculator/ -run TestCorpus3_29VsOracle -count=1 -v -timeout 60m'

[tasks.gate-poe2]
description = "The PoE2 corpus tests' summary lines (every TestCorpusPoE2* by default, --run <pattern> for one), cached by the committed tree and the local corpus; a dirty tree is measured fresh and never stored, --force re-runs"
usage = '''
flag "--run <run>" env="RUN" default="TestCorpusPoE2"
flag "--force" env="FORCE"
'''
run = '{{vars.GOPOB}} gate-poe2 --run "{{usage.run}}" {% if usage.force %}--force{% endif %}'

[tasks.gate-tight]
description = "The gate's pairs graded at relative 1e-9 (sub-tolerance drift the gate passes); asserts a miss ceiling. WORKLIST=<dir> writes stats.tsv / builds.tsv."
run = 'CORPUS=true {{vars.NICE}} go test ./calculator/ -run "^TestOracle329TightTolerance$" -count=1 -v -timeout 60m'

[tasks.test-full]
description = "Tier 3: everything, incl. the ~22 corpus sweeps (~9 min, re-measure: this figure has not been checked since the corpus promotion). Once per batch."
run = 'CORPUS=true {{vars.NICE}} go test ./... -count=1 -v -timeout 60m'

[tasks.test-frontend]
description = "Run all frontend tests"
dir = "frontend"
run = '{{vars.NICE}} pnpm run test'

[tasks.raw-controls]
description = "List raw .btn / .input / <select> / checkbox controls outside the design primitives, file:line (the ceiling and allow-list are in frontend/harness/raw_controls.json)"
dir = "frontend"
run = 'node harness/raw_controls.ts'

[tasks.write-path]
description = "Assert a mutation through the JS surface reaches Go, and a no-op load/save changes nothing"
dir = "frontend"
depends = ["build-go"]
run = '{{vars.NICE}} node harness/write_path.mjs'

[tasks.component-tests]
description = "Mount the real Svelte pages against the real worker and assert in Go"
dir = "frontend"
depends = ["build-go", "build-go2"]
run = '{{vars.NICE}} npx vitest run harness/component _mount.test.ts'

[tasks.e2e]
description = "Playwright journeys, properties and model-based sequences on a targeted build set, with a perf baseline; tests tagged @slow (benchmarks, WebGL draw lists, random sequences, the largest-build power report, font scaling) run only with --slow; --shard <i>/<n> runs CI's shard i"
dir = "frontend"
usage = '''
flag "--e2e-baseline" env="E2E_BASELINE"
flag "--grep <grep>" env="GREP"
flag "--reuse" env="REUSE"
flag "--shard <shard>" env="SHARD"
flag "--slow" env="SLOW"
flag "--specs <specs>" env="SPECS"
arg "[args]..." var=#true double_dash="required" help="passed on to playwright"
'''
run = [
  '{% if usage.shard %}env E2E_SLOW={% if usage.slow %}1{% else %}0{% endif %} node e2e/shard.mjs plan {{usage.shard}} e2e/.results/shard-tests.txt{% endif %}',
  '''
eval "set -- $usage_args"
{% if usage.reuse %}node e2e/serve.mjs port > /dev/null{% else %}env E2E_SLOW={% if usage.slow %}1{% else %}0{% endif %} node e2e/bundle.mjs for \
{% if usage.grep %}--grep "$usage_grep" {% endif %}{% if usage.shard %}--test-list e2e/.results/shard-tests.txt {% endif %}{{usage.specs}} "$@"{% endif %}
''',
  '''
eval "set -- $usage_args"
{{vars.NICE}} env E2E_BASELINE={% if usage.e2e_baseline %}1{% else %}0{% endif %} E2E_SLOW={% if usage.slow %}1{% else %}0{% endif %} \
{% if usage.reuse %}E2E_REUSE=1 E2E_PORT=$(node e2e/serve.mjs port){% endif %} \
npx playwright test -c e2e/playwright.config.ts {% if usage.grep %}--grep "$usage_grep" {% endif %}\
{% if usage.shard %}--test-list e2e/.results/shard-tests.txt {% endif %}{{usage.specs}} "$@"
''',
]

[tasks.e2e-rerun-failed]
description = "Re-run each test a full e2e run failed, with the spec files of the tests that started just before it, in one worker, --times times (default 3); --log is that run's saved output. Use it before re-running the whole suite for a lone failure"
dir = "frontend"
usage = '''
flag "--log <log>" env="LOG" required=#true
flag "--before <before>" env="BEFORE" default="12"
flag "--times <times>" env="TIMES" default="3"
'''
run = 'node e2e/rerun_failed.mjs --log "$usage_log" --before "$usage_before" --times "$usage_times"'

[tasks.e2e-durations]
description = "Record each e2e test's duration from a CI run (--run <id>, default the latest finished e2e run on dev) into frontend/e2e/durations.json, which CI's shards split by"
dir = "frontend"
usage = '''
flag "--run <run>" env="RUN"
'''
run = '''gh run view {% if usage.run %}{{usage.run}}{% else %}"$(gh run list --workflow e2e --branch dev --status completed --limit 1 --json databaseId -q '.[0].databaseId')"{% endif %} --log | node e2e/shard.mjs record'''

[tasks.e2e-smoke]
description = "The @smoke e2e tests alone: every page and the main journeys (--reuse serves a warm build)"
usage = '''
flag "--reuse" env="REUSE"
arg "[args]..." var=#true double_dash="required" help="passed on to playwright"
'''
run = 'eval "set -- $usage_args"; mise run e2e --grep @smoke {% if usage.reuse %}--reuse{% endif %} -- "$@"'

[tasks.e2e-affected]
description = "The e2e specs a change since --base (default dev, plus the working tree) can reach, and every @smoke test; frontend/e2e/affected.mjs says why, and names what it could not map"
usage = '''
flag "--base <base>" env="BASE" default="dev"
flag "--slow" env="SLOW"
flag "--reuse" env="REUSE"
arg "[args]..." var=#true double_dash="required" help="passed on to playwright"
'''
run = '''eval "set -- $usage_args"; grep=$(node frontend/e2e/affected.mjs grep '{{usage.base}}'); mise run e2e --grep "$grep" {% if usage.slow %}--slow{% endif %} {% if usage.reuse %}--reuse{% endif %} -- "$@"'''

[tasks.e2e-bundle]
description = "The wasm builds and the production bundle the e2e tests serve, each rebuilt only when a source of it is newer; the TinyGo wasm only with --tinygo (mise run e2e builds it for a selected test that loads it)"
dir = "frontend"
usage = '''
flag "--tinygo" env="TINYGO" help="build the TinyGo wasm too (minutes after a Go change)"
'''
run = 'node e2e/bundle.mjs {% if usage.tinygo %}with{% else %}without{% endif %}'

[tasks.e2e-bundle-build]
description = "The standard Go wasm builds and the production bundle, for e2e/bundle.mjs; it carries a TinyGo wasm only when one is built"
dir = "frontend"
hide = true
depends = ["build-go", "build-go2"]
sources = ["src/**/*", "static/**/*", "package.json", "pnpm-lock.yaml", "svelte.config.js", "vite.config.js", "tsconfig.json"]
outputs = ["build/.e2e-bundle"]
run = [
  '{{vars.NICE}} gzip -kf9 static/go-pob.wasm static/go-pob2.wasm',
  '{{vars.NICE}} npx vite build --logLevel warn',
  'touch build/.e2e-bundle',
]

[tasks.e2e-coverage]
description = "Record which frontend files each e2e spec runs into frontend/e2e/coverage-map.json, which e2e-affected selects by: a coverage build, then every spec (or the specs after --) once on its own preview server; a full run, so the operator's or CI's (.github/workflows/e2e-coverage.yml)"
dir = "frontend"
depends = ["build-go", "build-go2"]
usage = '''
flag "--servers <servers>" env="SERVERS" default="2"
flag "--workers <workers>" env="WORKERS" default="2"
arg "[specs]..." var=#true double_dash="required" help="spec files, default every spec"
'''
run = [
  'eval "set -- $usage_specs"; node e2e/coverage.mjs specs "$@"',
  '{{vars.NICE}} gzip -kf9 static/go-pob.wasm static/go-pob2.wasm',
  'rm -rf e2e/.coverage',
  '{{vars.NICE}} npx vite build -c e2e/vite.coverage.config.js --logLevel warn',
  '''
eval "set -- $usage_specs"
{{vars.NICE}} env E2E_SLOW=1 node e2e/coverage.mjs record --servers {{usage.servers}} --workers {{usage.workers}} "$@"
''',
  'node e2e/coverage.mjs merge',
]

[tasks.e2e-coverage-pull]
