{{vars.NICE}} env GOPOB_MOD_EXT=1 CORPUS=true go test ./calculator/ -run TestCorpus3_29VsOracle -count=1 -v -timeout 60m 2>&1 | grep -E "mod-ext:|matched [0-9]+ / [0-9]+|below floor|^(ok|FAIL|---)"; true
